name: Build BeanTelligence v6 Mobile (Capacitor 6+ iOS & Android SDK 35)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target mobile build (all, android, ios)'
        required: false
        default: 'all'

permissions:
  contents: read

jobs:
  assemble-web-bundle:
    name: Assemble Standalone Web & Capacitor www/
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build BeanTelligence v6 Web & Icons (Zero-Node PowerShell + .NET)
        shell: powershell
        run: |
          if (Test-Path scripts\build_app.ps1) {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_app.ps1 -EmitCapacitorWww
          } else {
            New-Item -ItemType Directory -Path www -Force | Out-Null
            Copy-Item index.html, manifest.webmanifest, sw.js -Destination www\ -Force
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\generate_icons.ps1 -OutDir www\icons -IncludeMobile

      - name: Upload Assembled www/ Bundle
        uses: actions/upload-artifact@v4
        with:
          name: beantelligence-v6-www
          path: www/

  build-android:
    name: Build Android API 35 (.apk & .aab)
    needs: assemble-web-bundle
    if: ${{ inputs.platform == 'all' || inputs.platform == 'android' || inputs.platform == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Assembled www/ Bundle
        uses: actions/download-artifact@v4
        with:
          name: beantelligence-v6-www
          path: www/

      - name: Setup Node.js 22 & Java 21 (Gradle SDK 35)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Capacitor 6+ Android Project
        run: |
          npm init -y
          npm install @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/android@^6.2.0 \
            @capacitor-community/bluetooth-le@^6.0.0 @capacitor-community/keep-awake@^6.0.0 \
            @capacitor/haptics@^6.0.0 @capacitor/filesystem@^6.0.0 @capacitor/share@^6.0.0 \
            @capacitor/camera@^6.0.0 @capacitor/status-bar@^6.0.0 @capacitor/splash-screen@^6.0.0
          cp mobile/capacitor.config.ts ./capacitor.config.ts
          npx cap add android
          cp mobile/android-template/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Assemble Debug APK (Target SDK 35)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: beantelligence-v6-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  build-ios:
    name: Build iOS Xcode 16 Archive (CoreBluetooth + Privacy Manifest)
    needs: assemble-web-bundle
    if: ${{ inputs.platform == 'all' || inputs.platform == 'ios' || inputs.platform == '' }}
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Assembled www/ Bundle
        uses: actions/download-artifact@v4
        with:
          name: beantelligence-v6-www
          path: www/

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Initialize Capacitor 6+ iOS Project
        run: |
          npm init -y
          npm install @capacitor/core@^6.2.0 @capacitor/cli@^6.2.0 @capacitor/ios@^6.2.0 \
            @capacitor-community/bluetooth-le@^6.0.0 @capacitor-community/keep-awake@^6.0.0 \
            @capacitor/haptics@^6.0.0 @capacitor/filesystem@^6.0.0 @capacitor/share@^6.0.0 \
            @capacitor/camera@^6.0.0 @capacitor/status-bar@^6.0.0 @capacitor/splash-screen@^6.0.0
          cp mobile/capacitor.config.ts ./capacitor.config.ts
          npx cap add ios
          cp mobile/ios-template/Info.plist ios/App/App/Info.plist
          cp mobile/ios-template/PrivacyInfo.xcprivacy ios/App/App/PrivacyInfo.xcprivacy
          npx cap sync ios

      - name: Build Unsigned Simulator .app via Xcode 16
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload iOS Simulator App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: beantelligence-v6-ios-sim-app
          path: build/ios/Build/Products/Release-iphonesimulator/App.app
