<div id="app-shell">
  <aside id="side-nav" aria-label="Studio Navigation">
    <div class="bt-rail-top-group">
      <button type="button" class="bt-rail-wordmark" id="rail-wordmark-btn" aria-label="BeanTelligence Home"></button>
      <nav class="bt-rail-nav" id="rail-tabs" aria-label="Primary Studio Tabs"></nav>
    </div>
    <div class="bt-rail-bottom-group">
      <div class="bt-rail-box" id="rail-lens-box" role="group" aria-label="Experience Lens"></div>
      <div class="bt-rail-box" id="rail-footer"></div>
    </div>
  </aside>

  <div class="bt-center-stage" id="center-stage">
    <header id="top-chrome" role="banner">
      <div class="bt-top-left">
        <button type="button" class="bt-top-brand" id="top-brand-btn" aria-label="BeanTelligence Home"></button>
      </div>
      <div class="bt-top-right">
        <div class="bt-lens-seg" id="top-lens-seg" role="group" aria-label="Experience Lens">
          <button type="button" data-lens-mode="starter" aria-pressed="false" title="Just Starting — warm plain English">Start</button>
          <button type="button" data-lens-mode="comfy" aria-pressed="true" title="Comfy Brewer — everyday specialty">Comfy</button>
          <button type="button" data-lens-mode="scientist" aria-pressed="false" title="Bean Scientist — full %TDS, %EY and citations">Sci</button>
        </div>
        <button type="button" class="bt-chrome-pill bt-gear-btn" id="top-gear-pill" aria-label="My Gear and Brewers Setup"></button>
        <button type="button" class="bt-chrome-pill bt-ble-dot-btn" id="top-ble-pill" aria-label="Bluetooth and Workflow Sensors">
          <span class="bt-status-dot" id="top-ble-dot"></span>
        </button>
        <button type="button" class="bt-icon-btn" id="top-theme-btn" aria-label="Toggle Light or Dark theme"></button>
      </div>
    </header>

    <div class="bt-workspace" id="workspace-grid">
      <main id="mount" tabindex="-1"></main>
      <div id="detail-pane" aria-label="Selected Detail Inspector"></div>
    </div>

    <div id="cta-shelf" class="bt-cta-shelf" hidden></div>
  </div>

  <aside id="studio-aside" aria-label="Live Telemetry and Beanjamin Studio Coach"></aside>

  <nav id="bottom-dock" aria-label="Primary Tabs"></nav>
</div>

<div id="sheet-backdrop" hidden aria-hidden="true"></div>
<section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-detent="half" hidden>
  <div class="bt-sheet-grab-zone" id="sheet-grab-zone" aria-hidden="true">
    <span class="bt-sheet-grab-pill"></span>
  </div>
  <header class="bt-sheet-header">
    <h2 class="bt-sheet-title" id="sheet-title">Studio</h2>
    <button type="button" class="bt-sheet-close" id="sheet-close-btn" aria-label="Close sheet"></button>
  </header>
  <div class="bt-sheet-body" id="sheet-body"></div>
</section>

<div id="keypad-host" hidden></div>
<div id="xray-loupe" role="tooltip" hidden></div>
<div id="toast-host" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="./bt-core.js"></script>
<script src="./bt-platform.js"></script>
<script src="./bt-ui.js"></script>
</body>
</html>
