<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NeuroBrew: brew it, cup it, perfect it</title>
<meta name="description" content="Brew it. Cup it. Perfect it. NeuroBrew gives you a brew recipe for your exact coffee, guides the brew, helps you taste and score it, and then helps you dial it in.">
<meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D3B3A" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="NeuroBrew: brew it, cup it, perfect it">
<meta property="og:description" content="Brew it. Cup it. Perfect it. NeuroBrew gives you a brew recipe for your exact coffee, guides the brew, helps you taste and score it, and then helps you dial it in.">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  /* NeuroBrew brand: deep teal #0D3B3A, amber #F2A93B, mint #1FA68A / #7FE0C3, cream #FBFAF7 / #F4EEE3 */
  --bg:#FBFAF7; --surface:#FFFFFF; --ink:#0D3B3A; --muted:#4A6664; --line:#E2DDCF;
  --accent:#9A5309; --accent-ink:#FFFFFF; --leaf:#12705E; --leaf-ink:#FFFFFF;
  --primary:#F2A93B; --primary-ink:#0D3B3A; --mint:#1FA68A;
  --track:#E7E2D3; --warn:#8A4B00; --focus:#1F6FEB; --tint:#F1EDE0; --gold:#F2A93B;
  --r1:#C9A468; --r2:#A97B4B; --r3:#865730; --r4:#643C22; --r5:#3E2516;
  --ui:"Poppins", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --txt:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0D3B3A; --surface:#134745; --ink:#F4EEE3; --muted:#A9C9C1; --line:#27625D;
    --accent:#F2A93B; --accent-ink:#0D3B3A; --leaf:#7FE0C3; --leaf-ink:#0D3B3A;
    --primary:#F2A93B; --primary-ink:#0D3B3A; --mint:#7FE0C3;
    --track:#1D5551; --warn:#F2C27A; --focus:#8CC4FF; --tint:#195049; --gold:#F2A93B;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0D3B3A; --surface:#134745; --ink:#F4EEE3; --muted:#A9C9C1; --line:#27625D;
  --accent:#F2A93B; --accent-ink:#0D3B3A; --leaf:#7FE0C3; --leaf-ink:#0D3B3A;
  --primary:#F2A93B; --primary-ink:#0D3B3A; --mint:#7FE0C3;
  --track:#1D5551; --warn:#F2C27A; --focus:#8CC4FF; --tint:#195049; --gold:#F2A93B;
}
html{ scroll-padding-top:calc(env(safe-area-inset-top, 0px) + 60px); background:var(--bg); }
*,*::before,*::after{ box-sizing:inherit; }
/* the box that wraps what is inside an opened details element does not match * in newer browsers, so it fell back to content-box and made full-width buttons inside folded cards 30 px too wide */
::details-content{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font:400 16px/1.45 var(--ui); -webkit-text-size-adjust:100%; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
.wrap{ max-width:600px; margin:0 auto; padding:0 16px 48px; }
body[data-screen="coffee"] .wrap, body[data-screen="recipe"] .wrap{ padding-bottom:110px; }
:root:has(body[data-screen="coffee"]), :root:has(body[data-screen="recipe"]){ scroll-padding-bottom:96px; }   /* a focused field is never left under the fixed bar */
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }

/* sticky header */
.stick{ position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line); }
.topbar{ display:flex; align-items:center; gap:8px; max-width:600px; margin:0 auto; padding:4px 12px; min-height:52px; }
.back{ border:0; background:transparent; font-weight:600; padding:8px 10px 8px 2px; min-height:44px; min-width:64px; display:flex; align-items:center; text-align:left; }
.back::before{ content:''; width:9px; height:9px; border-left:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(45deg); margin:0 8px 0 4px; }
.back[hidden]{ display:none; }
.toptitle{ flex:1; text-align:center; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
body[data-screen="start"] .stick{ display:none; }
.menubtn{ display:flex; align-items:center; gap:8px; min-height:44px; padding:0 14px 0 12px; border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); font-family:inherit; font-weight:600; font-size:15px; cursor:pointer; }
.menubtn:hover{ background:var(--tint); }
.menubtn:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
.menubtn .burger{ display:block; flex:none; }
.brand{ display:flex; align-items:center; gap:14px; margin:22px 0 4px; }
.brand .mk{ flex:none; display:block; line-height:0; }
.wm{ font-size:36px; line-height:1; letter-spacing:-0.035em; }
.wm .a{ font-weight:400; }
.wm .b{ font-weight:800; color:var(--accent); }
.scorebar{ padding:2px 16px 0; }
.scorebar[hidden]{ display:none; }
.scorebar.home .mark, .scorebar.home .meter-note{ display:none; }
.scorebar-inner{ max-width:600px; margin:0 auto; display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.score{ display:flex; align-items:baseline; gap:6px; }
.score .num{ font-weight:800; font-size:32px; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-0.02em; }
.score .of{ color:var(--muted); font-size:14px; }
.status{ text-align:right; font-size:13px; color:var(--muted); line-height:1.25; }
.meter{ position:relative; max-width:600px; margin:8px auto 0; height:6px; background:var(--track); border-radius:3px; }
.meter .fill{ position:absolute; left:0; top:0; bottom:0; width:0; background:var(--leaf); border-radius:3px; transition:width .15s ease; }
.meter .mark{ position:absolute; left:80%; top:-3px; bottom:-3px; width:2px; background:var(--ink); opacity:.55; }
.meter-note{ max-width:600px; margin:2px auto 6px; position:relative; height:14px; font-size:11px; color:var(--muted); }
.meter-note span{ position:absolute; left:80%; transform:translateX(-50%); }

h1{ font-weight:700; font-size:28px; line-height:1.14; letter-spacing:-0.025em; margin:22px 0 6px; }
h2{ font-weight:600; font-size:19px; letter-spacing:-0.01em; margin:28px 0 10px; }
h3{ font-weight:600; font-size:16px; margin:0 0 4px; }
.lede{ font-family:var(--txt); font-size:17px; color:var(--muted); margin:0 0 16px; line-height:1.45; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; margin:0 0 12px; }
.fine{ font-size:13px; color:var(--muted); margin:6px 0 0; }
.serif{ font-family:var(--txt); }
.muted{ color:var(--muted); }

/* fields */
.fields{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.field{ display:flex; flex-direction:column; gap:4px; min-width:0; margin-bottom:12px; }
.fields .field{ margin-bottom:0; }
.field.full{ grid-column:1 / -1; }
.field > label,.flabel{ font-size:14px; font-weight:600; }
.field input,.field select,.field textarea,.plain{
  font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
  background:var(--surface); width:100%; min-width:0;
}
.field textarea{ min-height:76px; resize:vertical; }
.hint{ font-size:13px; color:var(--muted); font-weight:400; }

/* choices */
.choices{ display:flex; flex-wrap:wrap; gap:8px; }
.choice{
  border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:10px 14px; min-height:46px;
  font-size:15px; font-weight:600; display:inline-flex; align-items:center; gap:8px; text-align:left;
}
.choice small{ display:block; font-weight:400; color:var(--muted); font-size:12px; line-height:1.2; }
.choice[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.choice[aria-pressed="true"] small{ color:inherit; opacity:.8; }
.swatch{ width:14px; height:14px; border-radius:50%; flex:none; border:1px solid rgba(0,0,0,.2); }
.choices.stack{ flex-direction:column; }
.choices.stack .choice{ width:100%; }

/* buttons */
.btn{ border-radius:12px; padding:13px 16px; font-weight:600; font-size:16px; min-height:50px; border:1px solid var(--line); background:var(--surface); }
.btn.primary{ background:var(--primary); color:var(--primary-ink); border-color:var(--primary); font-weight:700; }
.btn.primary:hover{ filter:brightness(.96); }
.btn.leaf{ background:var(--leaf); color:var(--leaf-ink); border-color:var(--leaf); }
.btn.danger{ border-color:var(--accent); color:var(--accent); }
.btn.link{ border:0; background:transparent; text-decoration:underline; min-height:40px; padding:8px 4px; }
.btn.block{ width:100%; }
.row{ display:flex; gap:10px; }
.row > *{ flex:1; }
.actions{ display:flex; gap:10px; margin-top:22px; }
.actions .primary{ flex:1; }
.msg{ margin:10px 0 0; font-size:14px; color:var(--warn); min-height:20px; }
.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.dock-inner{ max-width:600px; margin:0 auto; display:flex; gap:10px; }
.dock-inner .btn{ flex:1; }

/* coffee page */
.chipline{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px; }
.pill{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 12px; font-size:14px; display:inline-flex; align-items:center; gap:6px; }
.pill.static{ background:var(--tint); border-color:transparent; }
.notice{ border-left:4px solid var(--warn); background:var(--surface); border-radius:6px; padding:10px 12px; font-size:14px; margin:0 0 12px; border-top:1px solid var(--line); border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
.bars{ display:grid; gap:10px; }
.bar{ display:grid; grid-template-columns:84px 1fr auto; gap:10px; align-items:center; font-size:14px; }
.bar .segs{ display:flex; gap:4px; }
.bar .seg5{ flex:1; height:10px; border-radius:3px; background:var(--track); }
.bar .seg5.on{ background:var(--leaf); }
.bar .lvl{ color:var(--muted); font-size:13px; min-width:86px; text-align:right; }

/* methods */
.mgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.mcard{ text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:14px; min-height:104px; display:flex; flex-direction:column; gap:4px; }
.mcard b{ font-size:17px; }
.mcard span{ font-family:var(--txt); font-size:15px; color:var(--muted); line-height:1.3; }

/* method rows: thin and full width */
.mrows{ display:flex; flex-direction:column; gap:8px; }
.mrow{ width:100%; min-height:0; padding:12px 14px; gap:3px; }
.mrow .mtop{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.mrow .mtop b{ font-size:17px; color:var(--ink); }
.mrow .mchip{ flex:none; font-family:var(--ui); font-size:12px; font-weight:700; padding:2px 9px; border-radius:99px; border:1px solid var(--line); color:var(--muted); background:var(--bg); }
.mrow .mchip.best{ background:var(--primary); border-color:var(--primary); color:var(--primary-ink); }
.mrow .mchip.good{ border-color:var(--accent); color:var(--accent); }
.mrow .mcup{ font-family:var(--ui); font-size:12.5px; color:var(--muted); }
.mrow .mwhy{ font-family:var(--txt); font-size:14.5px; line-height:1.3; margin-top:2px; }
.mrow .mwhy.bad{ color:var(--accent); }
.mrow .mcols{ display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; margin-top:4px; }
.mrow .mlist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
.mrow .mlist li{ display:flex; gap:5px; font-family:var(--txt); font-size:13.5px; line-height:1.3; color:var(--ink); }
.mrow .mlist li i{ font-style:normal; font-weight:800; flex:none; width:12px; }
.mrow .mlist.pros li i{ color:var(--leaf); }
.mrow .mlist.cons li i{ color:var(--accent); }
.mrow.best{ border-color:var(--primary); box-shadow:0 0 0 1px var(--primary) inset; }
.mrow.poor{ opacity:.88; }
.mrow.picked{ outline:2px solid var(--primary); outline-offset:1px; }
.mgroup{ margin:18px 0 0; }
.mgroup .mgh h2{ margin:0; font-size:19px; }
.mgs{ font-family:var(--ui); font-size:13px; color:var(--muted); margin:2px 0 8px; }
details.mgroup > summary{ cursor:pointer; padding:10px 0; display:flex; flex-direction:column; }
details.mgroup > summary .mgt{ font-weight:700; font-size:17px; }
.mhow summary{ cursor:pointer; font-weight:700; }
.mrow .mlist li span{ font-size:13.5px; color:var(--ink); }
.lsec{ margin:22px 0 0; scroll-margin-top:130px; }
.lsec > h2{ margin:0 0 6px; }
.trow .tmain{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.trow .tmain b{ font-size:17px; }
.tchip{ font-family:var(--ui); font-size:12px; font-weight:700; padding:2px 9px; border-radius:99px; border:1px solid var(--line); }
.tchip.up{ border-color:var(--leaf); color:var(--leaf); }
.tchip.down{ border-color:var(--accent); color:var(--accent); }
.tsame{ color:var(--accent); }
.tcard{ padding:12px 14px; margin:0 0 8px; }
.shopline + .shopline{ border-top:1px solid var(--line); margin-top:8px; }
.fitcard h3{ margin:0 0 4px; }
.fit-good b{ color:var(--leaf); }
.fit-caution b{ color:var(--accent); }
#cmpCard .seg{ width:100%; }
.lsec a{ color:var(--accent); }
/* recipe */
.batch{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
.krow{ padding:12px 0; border-top:1px solid var(--line); }
.krow:first-child{ border-top:0; padding-top:2px; }
.krow-top{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
.krow-top span{ font-weight:600; }
.krow-top strong{ font-size:24px; font-weight:800; letter-spacing:-0.01em; text-align:right; font-variant-numeric:tabular-nums; }
.krow .sub{ text-align:right; font-size:14px; color:var(--ink); margin-top:1px; }
.krow .why{ font-family:var(--txt); font-size:15.5px; color:var(--muted); margin:4px 0 0; line-height:1.35; }
.steps{ list-style:none; margin:0; padding:0; }
.step{ display:grid; grid-template-columns:58px 1fr; gap:10px; padding:12px 0; border-top:1px solid var(--line); }
.step:first-child{ border-top:0; }
.step .t{ font-weight:800; font-variant-numeric:tabular-nums; font-size:18px; }
.step .tag{ display:inline-block; margin-top:4px; background:var(--tint); border-radius:999px; padding:2px 10px; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }
.step .d{ font-family:var(--txt); font-size:16.5px; line-height:1.35; }
.step.active{ background:var(--tint); margin:0 -14px; padding:12px 14px; border-radius:10px; border-top-color:transparent; }
.step.done{ opacity:.45; }
.prep{ margin:6px 0 0; padding-left:18px; font-family:var(--txt); font-size:16.5px; }
.prep li{ margin:4px 0; }
.watch{ border:1px solid var(--accent); border-radius:14px; padding:14px; margin:0 0 12px; }
.watch b{ color:var(--accent); }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.adj{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 12px; font-size:14px; }
/* how well supported a number is: dots and words, so colour is never the only signal */
.krow .ev, .tval + .fine + div .ev{ font-size:13px; font-weight:500; margin-top:2px; }
.ev .dt{ letter-spacing:1px; margin-right:3px; }
.ev-a{ color:var(--leaf); } .ev-b{ color:var(--accent); } .ev-c{ color:var(--muted); }
.krow .basis{ font-family:var(--txt); font-size:15.5px; color:var(--muted); margin:6px 0 0; line-height:1.35; }

.fxlist{ margin:6px 0 0; padding-left:18px; font-family:var(--txt); font-size:15.5px; line-height:1.4; }
.fxlist li{ margin:6px 0; }
.fxcard details.moreinfo{ margin-top:8px; }
/* timer */
.bigtime{ font-size:72px; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; letter-spacing:-0.03em; line-height:1; margin:18px 0 6px; }
.now{ text-align:center; margin:0 0 14px; }
.now .what{ font-size:22px; font-weight:800; }
.now .next{ color:var(--muted); font-size:15px; margin-top:4px; }
.pace{ font-variant-numeric:tabular-nums; text-align:center; font-size:17px; font-weight:600; min-height:46px; margin:2px 6px 10px; color:var(--ink); }
.target{ text-align:center; font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--leaf); }

/* scoring sliders (cupping) */
.attr-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.attr-name{ font-weight:600; font-size:17px; }
.attr-hint{ font-family:var(--txt); font-size:15px; color:var(--muted); margin:1px 0 0; line-height:1.35; }
.readout{ text-align:right; flex:none; min-width:86px; }
.val{ display:block; font-weight:800; font-size:26px; line-height:1.05; font-variant-numeric:tabular-nums; letter-spacing:-0.01em; }
.qual{ display:block; font-size:12px; color:var(--muted); }
.nudge{ width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--bg); font-size:20px; line-height:1; padding:0; }
.nudges{ display:flex; gap:6px; justify-content:flex-end; margin-top:6px; }
.slider{ -webkit-appearance:none; appearance:none; width:100%; height:44px; margin:0; background:transparent; --f:.5; touch-action:pan-y; display:block; }
.slider::-webkit-slider-runnable-track{ height:10px; border-radius:5px;
  background:linear-gradient(to right, var(--accent) 0, var(--accent) calc(14px + (100% - 28px) * var(--f)), var(--track) calc(14px + (100% - 28px) * var(--f)), var(--track) 100%); }
.slider.untouched::-webkit-slider-runnable-track{ background:var(--track); }
.slider::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:28px; height:28px; border-radius:50%; margin-top:-9px; background:var(--surface); border:3px solid var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.28); }
.slider.untouched::-webkit-slider-thumb{ border-color:var(--muted); }
.slider::-moz-range-track{ height:10px; border-radius:5px; background:var(--track); }
.slider::-moz-range-progress{ height:10px; border-radius:5px; background:var(--accent); }
.slider.untouched::-moz-range-progress{ background:transparent; }
.slider::-moz-range-thumb{ width:22px; height:22px; border-radius:50%; background:var(--surface); border:3px solid var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.28); }
.slider.untouched::-moz-range-thumb{ border-color:var(--muted); }
.slider:focus-visible{ outline:none; }
.slider:focus-visible::-webkit-slider-thumb{ outline:3px solid var(--focus); outline-offset:2px; }
.slider:focus-visible::-moz-range-thumb{ outline:3px solid var(--focus); outline-offset:2px; }
.scale{ margin-top:-6px; font-size:11px; color:var(--muted); }
.ticks,.bands{ position:relative; height:16px; }
.tick{ position:absolute; top:0; left:calc(14px + (100% - 28px) * var(--p)); transform:translateX(-50%); text-align:center; white-space:nowrap; line-height:1.2; }
.tick b{ font-weight:600; color:var(--ink); font-size:12px; font-variant-numeric:tabular-nums; }
.ticks .tick:first-child{ transform:translateX(-14px); }
.ticks .tick:last-child{ transform:translateX(calc(-100% + 14px)); }
.band{ position:absolute; top:0; left:calc(14px + (100% - 28px) * var(--p)); transform:translateX(-50%); white-space:nowrap; line-height:1.2; }
details.more{ margin-top:8px; border-top:1px solid var(--line); padding-top:8px; }
details.more summary{ cursor:pointer; font-size:14px; font-weight:600; color:var(--muted); min-height:36px; display:flex; align-items:center; list-style:none; }
details.more summary::-webkit-details-marker{ display:none; }
details.more summary::after{ content:'+'; margin-left:auto; font-size:22px; font-weight:400; line-height:1; }
details.more[open] summary::after{ content:'\2212'; }
details.more textarea{ width:100%; min-height:64px; margin-top:8px; padding:10px; font-size:16px; border:1px solid var(--line); border-radius:9px; background:var(--bg); }
.seg{ display:flex; border:1px solid var(--line); border-radius:11px; overflow:hidden; background:var(--bg); }
.seg button{ flex:1; border:0; background:transparent; padding:11px 8px; font-size:14px; font-weight:600; border-right:1px solid var(--line); min-height:44px; }
.seg button:last-child{ border-right:0; }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); }
.intensity{ margin-top:10px; }
.intensity .lab{ font-size:13px; color:var(--muted); margin-bottom:4px; display:flex; justify-content:space-between; }
.chip{ border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:7px 12px; font-size:14px; min-height:36px; }
.chip[aria-pressed="true"]{ background:var(--leaf); color:var(--leaf-ink); border-color:var(--leaf); }
.cups{ display:flex; gap:8px; margin-top:10px; align-items:center; }
.cup{ width:46px; height:46px; border-radius:50%; border:2px solid var(--leaf); background:transparent; font-weight:600; font-size:15px; color:var(--leaf); }
.cup[aria-pressed="true"]{ background:var(--leaf); color:var(--leaf-ink); }
.cups .pts{ margin-left:auto; font-weight:800; font-size:20px; font-variant-numeric:tabular-nums; }
.cups .pts small{ font-weight:400; color:var(--muted); font-size:13px; }
.stepper{ display:flex; align-items:center; gap:10px; }

.defect-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:6px 0; }
.defect-row .what{ font-size:15px; }
.defect-row .what small{ display:block; color:var(--muted); font-size:12px; }

/* save sheet */
.overlay{ position:fixed; inset:0; background:rgba(10,14,16,.55); z-index:20; display:none; align-items:flex-end; justify-content:center; }
.overlay.open{ display:flex; }
.sheet{ background:var(--surface); width:100%; max-width:600px; max-height:88%; overflow:auto; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); border:1px solid var(--line); }
.sheet h3{ margin:0 0 6px; font-size:20px; font-weight:800; letter-spacing:-0.01em; }
.sheet p{ margin:6px 0; }
.sheet .row{ margin-top:14px; }
.sheet textarea{ width:100%; min-height:110px; font-size:13px; font-family:ui-monospace, Menlo, Consolas, monospace; padding:10px; border:1px solid var(--line); border-radius:9px; background:var(--bg); }
.sheet input[type=file]{ width:100%; font-size:15px; margin-top:8px; }
.err{ color:var(--accent); font-size:14px; }
.ok{ color:var(--leaf); font-weight:600; }

#mount > .card:first-child{ margin-top:16px; }
#mount > .brand + .card{ margin-top:18px; }
#mount > .notice + .card{ margin-top:14px; }
.unitrow{ display:flex; gap:8px; }
.field .unitrow input{ flex:1 1 0; width:auto; min-width:0; }
.field .unitrow .unitsel{ width:112px; flex:none; }
.tval{ font-size:28px; font-weight:800; letter-spacing:-0.01em; font-variant-numeric:tabular-nums; line-height:1.1; }
.slwrap{ position:relative; margin-top:8px; }
.recmark{ position:absolute; top:13px; width:2px; height:18px; background:var(--ink); opacity:.5; transform:translateX(-1px); pointer-events:none; left:calc(14px + (100% - 28px) * var(--p)); z-index:1; }
.chart{ margin:8px 0 10px; }
.chart svg{ width:100%; height:auto; display:block; }
.chart text{ font:600 10px var(--ui); fill:var(--muted); }
.term{ text-decoration:underline dotted var(--accent); text-decoration-thickness:1.5px; text-underline-offset:3px; cursor:help; }
.term:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:3px; }
.techhint{ color:var(--leaf); font-weight:600; }
#techCard .choice small{ white-space:normal; }
.sweetband{ position:absolute; top:19px; height:6px; border-radius:3px; background:var(--leaf); opacity:.38; left:calc(14px + (100% - 28px) * var(--a)); width:calc((100% - 28px) * (var(--b) - var(--a))); pointer-events:none; }
.layerbox{ margin-top:12px; border-top:1px solid var(--line); padding-top:10px; }
.layerbox summary{ cursor:pointer; font-weight:600; font-size:14.5px; color:var(--accent); min-height:32px; }
.layers{ list-style:none; margin:8px 0 0; padding:0; }
.layers li{ font-family:var(--txt); font-size:15.5px; line-height:1.35; padding:8px 0; border-top:1px solid var(--line); }
.layers li b{ font-family:var(--ui); font-weight:600; display:block; font-size:14px; }
.ratiosug{ border-top:1px dashed var(--line); margin-top:6px; }
/* a heading that takes focus only so a dialog or a new page is announced is not a control, so it gets no focus ring; every real control keeps its ring */
#sheetTitle:focus, #sheetTitle:focus-visible, #mount h1[tabindex="-1"]:focus, #mount h1[tabindex="-1"]:focus-visible{ outline:none; }
/* logo, tappable progress, grind flash */
.brand.brandwrap{ display:block; position:relative; margin:8px 0 6px; }
.logobox{ position:relative; width:100%; max-width:350px; margin:0 auto; }
.logo{ display:block; width:100%; height:auto; }
.logo-dark{ display:none !important; }
:root[data-theme="dark"] .logo-light{ display:none !important; }
:root[data-theme="dark"] .logo-dark{ display:block !important; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .logo-light{ display:none !important; }
  :root:not([data-theme="light"]) .logo-dark{ display:block !important; }
}
.signin{ border-left:3px solid var(--warn); padding-left:10px; }
.progress{ align-items:stretch; gap:2px; padding:4px 8px 6px; }
.pstep{ flex-direction:column; justify-content:flex-start; gap:3px; font-family:inherit; font-size:11.5px; text-align:center; background:transparent; border:0; padding:4px 0 2px; min-height:50px; cursor:pointer; border-radius:10px; }
.pstep .pl{ line-height:1.1; max-width:100%; }
.pstep.plocked{ opacity:.45; cursor:not-allowed; }
.pstep.pnow{ cursor:default; }
.pstep:not(.plocked):not(.pnow):hover{ background:var(--tint); }
.pstep:focus-visible{ outline:2px solid var(--focus); outline-offset:-2px; }
.progressmsg{ padding:6px 16px; font-size:13.5px; background:var(--tint); color:var(--ink); border-bottom:1px solid var(--line); }
.progressmsg[hidden]{ display:none; }
body[data-screen="start"] .stick{ display:block; }
body[data-screen="start"] .scorebar{ display:none; }
.krow.flash{ animation:flashbg 2.6s ease-out 1; border-radius:10px; }
@keyframes flashbg{ 0%{ background:var(--tint); box-shadow:0 0 0 6px var(--tint); } 100%{ background:transparent; box-shadow:0 0 0 6px transparent; } }
/* levels, field labels, progress */
.fieldmeta{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; margin:2px 0 8px; font-size:12.5px; line-height:1.3; }
.fieldmeta .req, .fieldmeta .opt{ font-weight:700; font-size:11px; letter-spacing:.04em; text-transform:uppercase; padding:2px 7px; border-radius:999px; }
.fieldmeta .req{ background:var(--primary); color:var(--primary-ink); }
.fieldmeta .opt{ background:var(--tint); color:var(--muted); }
.fieldmeta .chg{ color:var(--leaf); font-weight:600; }
.fieldmeta .why{ color:var(--muted); flex-basis:100%; }
h2 + .fieldmeta{ margin-top:-4px; }
.levelopt{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%; text-align:left; padding:12px 14px; margin-top:8px; background:var(--surface); border:1.5px solid var(--line); border-radius:12px; color:var(--ink); font:inherit; cursor:pointer; min-height:56px; }
.levelopt span{ font-family:var(--txt); font-size:15px; color:var(--muted); }
.levelopt[aria-pressed="true"]{ border-color:var(--leaf); background:var(--tint); }
.progress{ display:flex; align-items:center; gap:6px; padding:6px 16px 8px; background:var(--surface); border-bottom:1px solid var(--line); }
.progress[hidden]{ display:none; }
.pstep{ flex:1; display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--muted); min-width:0; }
.pstep .pn{ flex:none; width:20px; height:20px; border-radius:50%; background:var(--tint); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }
.pstep .pl{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:20px; }
.pstep{ min-height:24px; }
.pstep .pn{ line-height:1; }
.pstep.pdone .pn{ background:var(--leaf); color:var(--leaf-ink); }
.pstep.pnow{ color:var(--ink); }
.pstep.pnow .pn{ background:var(--primary); color:var(--primary-ink); }

/* a label and its tag share a line when they fit, and the tag drops under the label when they do not */
.field.inl{ display:flex; flex-wrap:wrap; align-items:center; column-gap:10px; }
.field.inl > label{ flex:0 0 auto; margin:0; }
.field.inl > .fieldmeta{ flex:1 1 auto; margin:0 0 2px; justify-content:flex-end; }
.field.inl > :not(label):not(.fieldmeta){ flex:0 0 100%; min-width:0; }
.sechead{ display:flex; flex-wrap:wrap; align-items:center; column-gap:10px; }
.sechead > h2{ flex:0 0 auto; }
.sechead > .fieldmeta{ flex:1 1 auto; margin:6px 0 0; justify-content:flex-end; }
.compactlevel .cl-text{ margin:6px 0 0; }
.field.inl > label{ text-align:left; }
.field.inl > .fieldmeta{ justify-content:flex-start; }
.field.inl select.plain, .field.inl input.plain{ width:100%; }
.field.inl{ margin-top:14px; }
.field.inl:first-child{ margin-top:0; }
.field.inl{ flex-direction:row; }
.sechead{ flex-direction:row; }
/* uniform cupping cards */
.cardlabel{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:16px 0 8px; font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
.cardlabel .cl-sub{ font-weight:400; text-transform:none; letter-spacing:0; font-size:12.5px; }
.intensity .cl-auto{ color:var(--leaf); font-weight:600; }
.tipbox{ margin-top:10px; padding:10px 12px; background:var(--tint); border-left:3px solid var(--leaf); border-radius:10px; }
.tipbox[hidden]{ display:none; }
.tipstatus{ font-size:13.5px; color:var(--leaf); font-weight:600; }
.tipstatus:empty{ display:none; }
.tipstatus .btn.link{ padding:0; min-height:0; font-size:13.5px; text-align:left; }
.tiptext{ margin:4px 0 0; font-family:var(--txt); font-size:15.5px; line-height:1.35; }
.tiptext:empty{ display:none; }
/* cupping steps */
#mount{ counter-reset:step; }
.stepcard{ counter-increment:step; }
.stepno{ display:block; font-size:12px; font-weight:700; color:var(--accent); letter-spacing:.05em; text-transform:uppercase; margin-bottom:2px; }
.stepno::before{ content:'Step ' counter(step); }
.phase{ display:flex; gap:12px; align-items:flex-start; margin:28px 0 12px; }
.phase-n{ flex:none; width:32px; height:32px; border-radius:50%; background:var(--ink); color:var(--bg); display:flex; align-items:center; justify-content:center; font-weight:800; margin-top:1px; }
.phase h2{ margin:0 0 2px; }
details.help summary{ color:var(--accent); }
.words{ margin-top:12px; border-top:1px solid var(--line); padding-top:10px; }
.sheethead{ position:sticky; top:-18px; z-index:3; background:var(--surface); display:flex; justify-content:space-between; align-items:center; gap:12px; margin:-18px -16px 10px; padding:14px 16px 10px; border-bottom:1px solid var(--line); }
.pickedbox{ display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 8px; min-height:34px; align-items:center; }
.mcard .meta{ font-family:var(--ui); font-size:12.5px; color:var(--ink); opacity:.75; margin-top:auto; padding-top:6px; }
.stars{ margin:6px 0 0 }
.starrow{ display:flex; gap:6px; align-items:center }
.star{ position:relative; width:48px; height:48px; flex:none }
.star .sbg, .star .sfg{ position:absolute; top:0; left:0; bottom:0 }
.star .sbg{ width:100% }
.star .sbg svg, .star .sfg svg{ display:block; width:48px; height:48px; stroke-width:1.6; stroke-linejoin:round }
.star .sbg svg{ fill:none; stroke:var(--muted) }
.star .sfg{ width:0; overflow:hidden }
.star .sfg svg{ fill:var(--primary); stroke:var(--accent) }
.star.full .sfg{ width:100% }
.star.half .sfg{ width:50% }
.starhit{ position:absolute; top:0; bottom:0; width:50%; margin:0; padding:0; min-height:0; min-width:0; border:0; border-radius:10px; background:transparent; cursor:pointer; -webkit-appearance:none; appearance:none; touch-action:manipulation }
.starhit.l{ left:0 }
.starhit.r{ right:0 }
.starhit:focus-visible{ outline:3px solid var(--focus); outline-offset:-3px }
.starfoot{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:4px; min-height:36px }
.starread{ font:600 15px/1.3 var(--ui); color:var(--ink) }
.starclear{ margin:0 }
.hrow .mr{ margin-top:3px; font:600 14px/1.3 var(--ui); color:var(--accent) }
/* bag guide, wheel, scan */
.gcard{ padding:12px 14px; }
.gcard summary{ list-style:none; cursor:pointer; display:flex; flex-direction:column; gap:2px; position:relative; padding-right:28px; min-height:44px; justify-content:center; }
.gcard summary::-webkit-details-marker{ display:none; }
.gcard summary::after{ content:'+'; position:absolute; right:0; top:50%; transform:translateY(-52%); font-size:24px; font-weight:400; color:var(--muted); }
.gcard[open] summary::after{ content:'\2212'; }
.gt{ font-weight:600; font-size:17px; }
.gs{ font-family:var(--txt); font-size:15px; color:var(--muted); line-height:1.3; }
.gbody{ margin-top:10px; border-top:1px solid var(--line); padding-top:6px; }
.gp{ margin:8px 0; font-size:16.5px; line-height:1.4; }
.explain{ font-family:var(--txt); font-size:15.5px; margin-top:8px; }
.h2row{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
.h2row h2{ margin-bottom:10px; }
.btn.small{ min-height:40px; padding:8px 14px; font-size:15px; margin-bottom:10px; }
.wheelwrap{ width:min(100%, max(250px, calc(100vh - 520px))); width:min(100%, max(250px, calc(100svh - 520px))); max-width:360px; margin:2px auto 0; }
.wheelbtn{ display:flex; align-items:center; gap:12px; width:100%; margin:12px 0 0; padding:10px 14px; min-height:56px; text-align:left; background:var(--ink); color:var(--bg); border:0; border-radius:14px; font-weight:700; font-size:16px; box-shadow:0 8px 16px -10px color-mix(in srgb, var(--ink) 70%, transparent); }
.wheelbtn:hover{ filter:brightness(1.12); }
.wheelbtn .wbicon{ flex:none; width:34px; height:34px; border-radius:50%; position:relative; box-shadow:0 0 0 2px var(--bg); }
.wheelbtn .wbicon::after{ content:''; position:absolute; inset:10px; border-radius:50%; background:var(--ink); }
.wheelbtn .wbtext{ flex:1; }
.wheelbtn .wbgo{ flex:none; width:9px; height:9px; margin-right:4px; border-right:2.5px solid currentColor; border-top:2.5px solid currentColor; transform:rotate(45deg); }
.wheelwrap svg, .wheelwrap .wedge{ -webkit-tap-highlight-color:transparent; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
.lenrow{ display:flex; align-items:center; gap:10px; margin:0 0 4px; }
.lenlabel{ flex:1; font-size:13.5px; font-weight:600; line-height:1.25; }
.lenrow .seg{ flex:none; width:206px; }
.wheelwrap svg{ width:100%; height:auto; display:block; margin:0 auto; }
.chip.wfam{ background:var(--c); color:var(--ci); border:2px solid var(--c); font-weight:700; }
.chip.wfam[aria-pressed="true"]{ background:var(--c); color:var(--ci); border-color:var(--c); box-shadow:0 0 0 2px var(--surface), 0 0 0 4.5px var(--ink); }
.chip.wfam[aria-pressed="true"]::before{ content:'✓'; margin-right:6px; font-weight:800; }
.chip.wgrp{ background:var(--t); color:#1B2B2A; border:2px solid var(--c); font-weight:600; }
.chip.wgrp[aria-pressed="true"]{ background:var(--c); color:var(--ci); border-color:var(--c); }
.wfamtitle{ border-left:6px solid var(--c); padding-left:10px; }
.wedge{ cursor:pointer; }
.wedge:focus-visible{ outline:none; stroke:var(--focus) !important; stroke-width:3.5 !important; }
.wpanel{ margin-top:8px; }
.rvrow{ display:grid; grid-template-columns:28px 1fr; gap:10px; padding:10px 0; border-top:1px solid var(--line); align-items:start; }
.rvrow input[type=checkbox]{ width:22px; height:22px; margin-top:24px; }
.rvrow .plain{ width:100%; font-size:16px; padding:9px 10px; border:1px solid var(--line); border-radius:9px; background:var(--bg); }
#mount.selmode{ padding-bottom:90px; }
.selbar{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin:0 0 10px; padding:8px 12px; background:var(--tint); border-radius:12px; }
.selbar[hidden]{ display:none; }
.hrow.sel{ grid-template-columns:30px 1fr auto; cursor:pointer; }
.chkbox{ width:22px; height:22px; border:2px solid var(--muted); border-radius:6px; display:flex; align-items:center; justify-content:center; }
.chkbox.on{ background:var(--primary); border-color:var(--primary); }
.chkbox.on::after{ content:''; width:6px; height:11px; border:solid var(--primary-ink); border-width:0 2.5px 2.5px 0; transform:rotate(45deg); margin-top:-2px; }
.btn:disabled{ opacity:.55; cursor:default; }
/* cards folded inside a closed card lose their own frame, so there is one border, not two */
.gcard .gbody > .card{ border:0; box-shadow:none; background:transparent; padding:12px 0 0; margin:0; }
.gcard .gbody > .card + .card{ border-top:1px solid var(--line); margin-top:14px; }
.gcard .gs{ font-size:13.5px; line-height:1.3; }
.chip.sug{ border-style:dashed; }
.regionnote{ border-left:3px solid var(--warn); padding-left:10px; color:var(--ink); }
.varpick > summary, details.more > summary{ cursor:pointer; }
/* history */
.hrow{ display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:0 0 10px; min-height:64px; }
.hrow .nm{ font-weight:600; font-size:17px; line-height:1.25; overflow-wrap:anywhere; }
.hrow .mt{ font-size:13px; color:var(--muted); margin-top:2px; }
.hrow .sc{ text-align:right; }
.hrow .sc b{ display:block; font-size:24px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
.hrow .sc span{ font-size:11px; color:var(--muted); }
.hrow .sc.spec b{ color:var(--leaf); }
.dscore{ display:flex; align-items:baseline; gap:10px; margin:0 0 14px; flex-wrap:wrap; }
.dscore b{ font-size:44px; font-weight:800; letter-spacing:-0.02em; line-height:1; font-variant-numeric:tabular-nums; }
.dscore span{ color:var(--muted); font-size:14px; }
.kv{ display:grid; grid-template-columns:112px 1fr; gap:8px 12px; font-size:15px; margin:8px 0 0; }
.kv dt{ color:var(--muted); }
.kv dd{ margin:0; font-weight:500; overflow-wrap:anywhere; }

[data-mode="single"] .only-five{ display:none !important; }
[data-mode="five"] .only-single{ display:none !important; }
@media (prefers-reduced-motion: reduce){ .meter .fill{ transition:none; } }
@media (max-width:380px){ .fields{ grid-template-columns:1fr; } .batch{ grid-template-columns:1fr; } }
/* ---------- polish: one calm, consistent surface language ---------- */
.levelcard{ padding:12px 14px; }
.levelseg .levelopt{ width:auto; flex:1; margin:0; padding:9px 6px; min-height:44px; border:0; border-right:1px solid var(--line); border-radius:0; background:transparent; display:block; text-align:center; font-size:14.5px; font-weight:600; color:var(--ink); }
.levelseg .levelopt:last-child{ border-right:0; }
.levelseg .levelopt:hover{ background:var(--tint); }
.card.slim{ padding:12px 14px; }
.fieldmeta .whybtn{ border:0; background:transparent; padding:2px 0; font:inherit; font-weight:600; color:var(--leaf); cursor:pointer; min-height:28px; display:inline-flex; align-items:center; gap:5px; }
.fieldmeta .whybtn::after{ content:'?'; display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; border:1.5px solid currentColor; font-size:11px; font-weight:700; line-height:1; }

.levelseg .levelopt[aria-pressed="true"]{ background:var(--primary); color:var(--primary-ink); }

/* menu, glossary, help */
.menulist{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
.menulabel{ font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:12px 2px 2px; }
.menulabel:first-child{ margin-top:2px; }
.menuitem{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%; text-align:left; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-radius:13px; color:var(--ink); min-height:54px; position:relative; padding-right:34px; }
.menuitem::after{ content:''; position:absolute; right:16px; top:50%; width:8px; height:8px; border-right:2px solid var(--muted); border-top:2px solid var(--muted); transform:translateY(-50%) rotate(45deg); }
.menuitem:hover{ background:var(--tint); }
.menuitem .mi-t{ font-weight:600; font-size:16px; }
.menuitem .mi-s{ font-family:var(--txt); font-size:15px; color:var(--muted); line-height:1.3; }
.gl-list{ margin-top:6px; }
.gl-item{ padding:10px 0; border-top:1px solid var(--line); }
.gl-item p{ margin:3px 0 0; font-size:16px; line-height:1.35; }
.gl-term{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.gl-grp{ font-size:11.5px; font-weight:600; color:var(--muted); background:var(--tint); border-radius:999px; padding:2px 8px; white-space:nowrap; }
.howto{ margin:12px 0; }
.howto-t{ font-weight:600; }
.howto p{ margin:2px 0 0; font-size:16.5px; }
.termhint{ border-left:3px solid var(--gold); padding:4px 0 4px 10px; margin:0 0 10px; }
.term.tsub{ text-decoration-color:var(--muted); text-decoration-thickness:1px; }
.attr-toggle{ flex:1; min-width:0; cursor:pointer; border-radius:10px; }
.attr-toggle:focus-visible{ outline:2px solid var(--focus); outline-offset:3px; }
.attr-sum{ display:none; font-family:var(--txt); font-size:14px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
[data-cupview="compact"] .stepcard .attr-toggle .attr-name::after{ content:''; display:inline-block; width:8px; height:8px; margin-left:10px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(45deg) translateY(-3px); transition:transform .15s ease; }
[data-cupview="compact"] .stepcard.open .attr-toggle .attr-name::after{ transform:rotate(-135deg) translateY(1px); }
[data-cupview="compact"] .stepcard:not(.open) .cardbody, [data-cupview="compact"] .stepcard:not(.open) .attr-hint{ display:none; }
[data-cupview="compact"] .stepcard:not(.open) .attr-sum{ display:block; }
[data-cupview="compact"] .stepcard:not(.open){ padding-top:10px; padding-bottom:10px; margin-bottom:8px; }
[data-cupview="compact"] .stepcard:not(.open) .readout .nudges{ margin-top:4px; }
.viewrow{ display:flex; align-items:center; gap:10px; margin:10px 0 2px; }
.viewrow .seg{ flex:1; max-width:250px; }
.sr-only{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.pill.guess{ border:1px dashed var(--muted); background:transparent; }
.ecchart{ margin:10px 0 4px; }
.whyrow{ margin:0; }
.whyrow summary{ cursor:pointer; list-style:none; font-size:13.5px; font-weight:600; color:var(--accent); min-height:30px; display:inline-flex; align-items:center; gap:5px; }
.whyrow summary::-webkit-details-marker{ display:none; }
.whyrow summary::after{ content:'+'; font-size:17px; font-weight:700; line-height:1; }
.whyrow[open] summary::after{ content:'\2212'; }
.presets{ flex-wrap:nowrap; gap:6px; }
.presets .choice{ flex:1 1 auto; font-size:12.5px; padding:9px 3px; text-align:center; min-width:0; letter-spacing:-0.01em; line-height:1.2; }
.presets{ gap:5px; }
/* the menu on a wide screen: a panel under the header, in the same column as the page, not a sheet from the bottom */
@media (min-width:760px){
  .overlay.menupanel{ align-items:flex-start; }
  .overlay.menupanel .sheet{ margin-top:58px; max-height:calc(100% - 78px); border-radius:16px; box-shadow:0 24px 48px -24px rgba(10,14,16,.55); }
}
.menufoot{ margin-top:16px; padding-top:12px; border-top:1px solid var(--line); text-align:center; }
.menufoot .rel{ font-size:13.5px; color:var(--muted); margin:0; }
.menufoot .rel b{ color:var(--ink); }
.menufoot .btn.link{ margin:2px 0 0; min-height:40px; }
/* links inside a sheet (the listing found by Look up this coffee) and the choices it offers */
.sheet a{ color:var(--leaf); font-weight:600; text-underline-offset:2px; }
.sheet .shoppick{ text-align:left; }
.setuphead{ margin:18px 0 6px; font-size:16px; }
.setuppair{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media (max-width:380px){ .presets{ flex-wrap:wrap; } .presets .choice{ flex:1 1 44%; padding:9px 6px; } }
#techCard .choice:not([aria-pressed="true"]) small{ display:none; }
.stepcard .cardlabel{ margin:12px 0 6px; }
.stepcard details.more{ margin-top:4px; padding-top:4px; }
.stepcard .words{ margin-top:8px; padding-top:8px; }
.nudge.big{ width:48px; height:48px; font-size:26px; font-weight:600; touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
.nudge.big:active{ background:var(--tint); }
.readout .nudges{ gap:8px; margin-top:8px; }
.twocol{ display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start; }
.twocol .field{ margin-bottom:6px; }
.twocol .fine{ grid-column:1 / -1; }
.dnwrap[hidden]{ display:none; }
.waybtn{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; padding:12px 14px; min-height:60px; }
.waybtn .wb-t{ font-weight:700; font-size:16px; }
.waybtn .wb-s{ font-family:var(--txt); font-weight:400; font-size:14.5px; line-height:1.3; opacity:.9; }
.warnline{ border-left:3px solid var(--warn); padding-left:10px; color:var(--ink); }
.measure p{ margin:4px 0; }
.mcard.fit{ border-color:var(--primary); box-shadow:0 0 0 1px var(--primary) inset; }
.mcard .match{ display:block; margin-top:8px; font-weight:700; font-size:12.5px; color:var(--accent); }
.strengthrow{ margin-top:12px; }
.moreinfo{ margin-top:10px; border-top:1px solid var(--line); padding-top:6px; }
.moreinfo summary{ cursor:pointer; font-weight:600; font-size:14.5px; color:var(--accent); min-height:36px; display:flex; align-items:center; }
.stick{ box-shadow:0 8px 22px -20px rgba(43,27,18,.55); }
.topbar, .progress, .progressmsg{ max-width:600px; margin-left:auto; margin-right:auto; width:100%; }
.card{ border-radius:16px; box-shadow:0 1px 2px rgba(43,27,18,.04), 0 12px 26px -20px rgba(43,27,18,.35); }
.notice{ border-radius:10px; }
.btn{ border-radius:13px; transition:transform .06s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease; }
.btn:active{ transform:scale(.985); }
.btn.primary{ box-shadow:0 8px 16px -10px color-mix(in srgb, var(--primary) 85%, transparent); }
.btn.primary:hover{ filter:brightness(1.06); }
.choice, .chip, .seg button, .levelopt, .mcard, .hrow{ transition:background-color .12s ease, color .12s ease, border-color .12s ease; }
.chip{ min-height:38px; }
h1{ letter-spacing:-0.028em; }
.lede{ line-height:1.42; }
.fieldmeta .req, .fieldmeta .opt{ font-size:12px; }
.bands .band, .scale .tick b{ font-size:12px; }
.term{ padding:3px 0; margin:-3px 0; }
.mcard .meta.techhint{ color:var(--accent); }
::selection{ background:color-mix(in srgb, var(--gold) 45%, transparent); }
.gear .field{ margin:0 0 10px; }
.gear select{ width:100%; min-height:48px; }
.gearread{ margin:2px 0 12px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
.gearread .gr-big{ font-size:22px; font-weight:700; line-height:1.25; margin:2px 0 4px; }
.gearread .gr-big small{ font-size:14px; font-weight:500; color:var(--muted); }
.gearhint{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:-4px 0 8px; }
.trail{ list-style:none; margin:0; padding:0; }
.trl{ padding:10px 0 10px 12px; border-left:3px solid var(--line); margin:0 0 2px 4px; }
.trl.best{ border-left-color:var(--leaf); }
.trl-top{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.trl-top b{ font-size:16px; }
.trl-sc{ font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; }
.trl-tag{ font-size:12px; padding:2px 8px; }
.trl-mt{ font-size:13px; color:var(--muted); margin-top:2px; overflow-wrap:anywhere; }
.trl-ch{ font-family:var(--txt); font-size:15.5px; line-height:1.4; margin-top:4px; }
.trl-v{ font-size:14px; margin-top:4px; }
.trl-v.v-helped b{ color:var(--leaf); }
.trl-v.v-hurt b{ color:var(--warn); }
.trl-v.v-same, .trl-v.v-incomparable, .trl-v.v-unscored{ color:var(--muted); }
.trl-v.v-same b{ color:var(--ink); }
.trl-mv, .trl-note{ font-size:13.5px; color:var(--muted); margin-top:3px; font-family:var(--txt); }
.trl-old{ margin:0 0 8px; }
#startFrom .choice{ text-align:left; }
.dialrow .nm, .dialrow .mt{ display:block; }
.dialrow .nm{ font-weight:600; font-size:17px; line-height:1.25; overflow-wrap:anywhere; }
.dialrow .sc{ text-align:right; }
.dialrow .sc b{ display:block; font-size:22px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
.dialrow .sc span{ font-size:11px; color:var(--muted); }
#startFrom .choice .fine{ color:inherit; opacity:.85; }
.dialrow [hidden]{ display:none; }
.trl.locked{ border-left-color:var(--gold); }
.trl-lock{ font-size:14px; }
</style>
</head>

function expectFor(coffee, now){
  const p = profileOf(coffee, now);
  let a = { light:4, 'medium-light':3.5, medium:3, 'medium-dark':2, dark:1.5 }[p.roast];
  let b = { light:2, 'medium-light':2.5, medium:3, 'medium-dark':3.5, dark:4 }[p.roast];
  let s = { light:3, 'medium-light':3, medium:3.5, 'medium-dark':3, dark:2.5 }[p.roast];
  if (p.process === 'washed'){ a += .5; }
  if (p.process === 'natural'){ b += 1; s += 1; }
  if (p.process === 'honey'){ b += .5; s += 1; }
  if (isFerment(p.process)){ b += .5; s += 1; }
  if (p.process === 'wet-hulled'){ a -= 1; b += 1.5; }
  if (p.density === 'high'){ a += .5; s += .5; }
  if (p.density === 'low'){ a -= .5; }
  const clamp = v => Math.min(5, Math.max(1, Math.round(v)));
  const lv = ['', 'Low', 'Low to medium', 'Medium', 'Medium to high', 'High'];
  const bars = [
    { label:'Acidity', level:clamp(a) }, { label:'Body', level:clamp(b) }, { label:'Sweetness', level:clamp(s) }
  ].map(x => ({ label:x.label, level:x.level, text:lv[x.level] }));
  const procText = {
    washed:'Washed coffees tend to taste clean and bright, with clear, distinct flavors.',
    natural:'Natural coffees (dried in the fruit) tend to be fruit-forward and sweet with heavier body. They can turn winey or funky if over-extracted.',
    honey:'Honey-processed coffees tend to be sweet and syrupy, between washed clarity and natural fruitiness.',
    anaerobic:'Anaerobic fermentation often gives intense, winey, tropical, or spiced flavors. It can turn boozy if brewed too strong or too hot.',
    carbonic:'Carbonic maceration tends to give vivid, fruity, sometimes winey flavors. Handle gently, since the aromatics are fragile.',
    infused:'Co-fermented or infused coffees often taste bold and unusual, sometimes candy-like or spiced, because flavor can be added during processing.',
    'wet-hulled':'Wet-hulled coffees tend to be earthy and herbal with heavy body and low acidity.',
    unknown:''
  }[p.process];
  const roastText = {
    light:'Light roast: the brightest acidity, with floral and fruity notes at their clearest.',
    'medium-light':'Medium-light roast: bright but rounder, with sweetness showing next to the fruit.',
    medium:'Medium roast: balanced, with caramel, nut, and chocolate starting to show.',
    'medium-dark':'Medium-dark roast: lower acidity, with chocolate, caramel, and a hint of roast.',
    dark:'Dark roast: heavy and bittersweet with smoky notes and little acidity.'
  }[p.roast];
  const densText = {
    high:'High-elevation beans grow slowly and dense. They often bring more complex acidity and sweetness, and take more effort to extract.',
    mid:'Mid-elevation beans lean neither way, so the roast and process do most of the talking.',
    low:'Lower-elevation beans are softer and usually mellower. They extract quickly, so watch for bitterness.',
    unknown:''
  }[p.density];
  const lookProc = { washed:['Floral','Citrus','Tea-like'], natural:['Berry','Tropical fruit','Winey'], honey:['Stone fruit','Brown sugar','Honey'],
    anaerobic:['Boozy fruit','Spice','Candy-like'], carbonic:['Ripe fruit','Winey','Spice'], infused:['Candy-like','Spice','Ripe fruit'], 'wet-hulled':['Earthy','Herbal','Tobacco'], unknown:[] }[p.process];
  const lookRoast = { light:['Jasmine','Stone fruit'], 'medium-light':['Apple','Honey'], medium:['Caramel','Nutty','Milk chocolate'],
    'medium-dark':['Dark chocolate','Toasted nut'], dark:['Smoke','Roasted','Bittersweet chocolate'] }[p.roast];
  const look = Array.from(new Set([].concat(lookProc, lookRoast))).slice(0, 6);
  const gsn = k => (p.guessed || []).some(x => x.key === k) ? ' (This is a guess from the origin.)' : '';
  return { profile:p, bars, notes:[roastText, procText ? procText + gsn('process') : '', densText ? densText + gsn('density') : ''].filter(Boolean), look, freshness:freshnessFor(p) };
}

const SYMPTOMS = [
  { v:'sour', label:'Sour or sharp' }, { v:'bitter', label:'Bitter or harsh' }, { v:'astringent', label:'Dry or puckery' },
  { v:'uneven', label:'Sour and bitter together' }, { v:'flat', label:'Flat or weak' }, { v:'muddy', label:'Muddy or silty' },
  { v:'thin', label:'Thin or hollow' }, { v:'strong', label:'Too strong or heavy' }, { v:'great', label:'Tastes great' }

function fixFor(sym, rec, ctx){
  ctx = ctx || {};

  if (ctx.tech === 'pulse'){
    if (sym === 'sour'){
      if (ctx.pulseTaste !== 'sweet') return { primary:'Make the first pour smaller and the second one bigger (on a 300 g brew, 50 g then 70 g). That leans the cup toward sweetness.',
        secondary:'Still sour? Grind one step finer (about ' + step + ' µm), or use four final pours for more strength.',
        why:'In the 4:6 method, a bigger first pour brings out acidity and a smaller one brings out sweetness.', adjust:A(0, 0, { pulse:{ taste:'sweet' } }) };
      return { primary:'You already leaned toward sweetness, so grind one step finer (about ' + step + ' µm).', secondary:'You could also use four final pours for a stronger cup.',
        why:'Sourness that stays after the taste dial means the coffee needs more extraction overall.', adjust:A(1) };
    }
    if (sym === 'bitter' || sym === 'astringent'){
      if (ctx.pulseStrength !== 'light') return { primary:'Use two bigger final pours instead of three. That makes a lighter cup.', secondary:'Still harsh? Grind one step coarser (about ' + step + ' µm).',
        why:'In the 4:6 method the final pours set the strength, and fewer, bigger pours give a lighter, gentler cup.', adjust:A(0, 0, { pulse:{ strength:'light' } }) };
      return { primary:'Grind one step coarser (about ' + step + ' µm).', secondary:'You already use the lightest pour setting, so the grind is the next lever.',
        why:'Bitterness usually means too much came out of the coffee.', adjust:A(-1) };

function fitToTendencies(t, cand){

  if (!res.ready) return res;
  const have = { roast:cand.roast || '', process:cand.process && cand.process !== 'unknown' ? cand.process : '', density:cand.density && cand.density !== 'unknown' ? cand.density : '', origin:'', variety:'' };
  if (cand.origin){ const om = originMatch(cand.origin); have.origin = om.origin ? (om.origin.key === 'africa' ? 'East Africa' : om.origin.name) : (om.country ? om.country.name : ''); }
  if (cand.varietal){ const v = varietyFor(cand.varietal); have.variety = v ? v.name : ''; }

function glossaryEntries(){
  const grp = k => TERM_GROUPS.brewing.includes(k) ? 'Brewing' : TERM_GROUPS.tasting.includes(k) ? 'Tasting' : 'On the bag';
  const out = TERMS.map(t => ({ term:t.title, def:t.def, group:grp(t.key), key:t.key }));
  const have = new Set(out.map(x => x.term.toLowerCase()));

function filterGlossary(list, q, group){

  const col = {}; header.forEach((k, i) => { col[k] = i; });
  if (col.coffee_name == null) return { error:'This file has no coffee_name column.' };
  if (!cleanLine(edit.name)) return { error:'A coffee needs a name.' };
  const set = new Set(idxs), cells = {};
  idxs.forEach(i => { cells[i] = coffeeEditCells(edit, col.cupping_date != null ? rows[i][col.cupping_date] : ''); });
  /* an older file may lack a column for a detail you just filled in: add it (blank for every other cupping), never otherwise */
  const hdr = header.slice();
  EDITABLE_COLUMNS.forEach(k => { if (!hdr.includes(k) && idxs.some(i => cells[i][k] !== '')) hdr.push(k); });
  const c2 = {}; hdr.forEach((k, i) => { c2[k] = i; });
  const grew = hdr.length > header.length, out = [], before = [];
  rows.forEach((r, i) => {
    const base = r.slice(); while (base.length < hdr.length) base.push('');
    if (!set.has(i)){ out.push(grew ? base : r); return; }
    const nr = base.slice(); let changed = false;
    EDITABLE_COLUMNS.forEach(k => { if (c2[k] == null) return; const nv = cells[i][k], ov = nr[c2[k]] == null ? '' : nr[c2[k]]; if (ov !== nv){ nr[c2[k]] = nv; changed = true; } });
    nr.forEach((v, j) => { if (!EDITABLE_COLUMNS.includes(hdr[j]) && v !== base[j]) throw new Error('A locked column would change: ' + hdr[j]); });   /* the cupping itself is never touched */
    if (changed){ before.push({ idx:i, row:r }); out.push(nr); } else out.push(grew ? base : r);
  });
  if (!before.length) return { rows, header, changed:0, before };
  return { rows:out, header:hdr, changed:before.length, before, added:hdr.slice(header.length) };
}
function sameCoffeeIdx(objs, o){

/* ---------- starting points from your other coffees ----------
   For every other coffee you have dialed in on this method, take the recipe you ended on (the one you locked, else your best try once you had made at least two)
   and measure how far it sits from the recipe NeuroBrew would have given that coffee: grind in dial-in steps, ratio, water temperature.
   A shift counts as a pattern in your cups only when at least PRIOR_MIN_COFFEES different coffees agree on its direction and none of the others went the other way.
   That count is the same minimum group the tendencies page uses. It is a pattern in YOUR cups, not a rule about coffee: it can come from your taste, your grinder or your water, and these cannot be told apart here.
   It is only ever offered as a suggestion for the first brew of a new coffee; it is never applied for you. */
const PRIOR_MIN_COFFEES = 3;   /* the same minimum group as the tendencies page */
const PRIOR_MIN_GRIND = 0.5;   /* dial-in steps: the smallest grind shift worth suggesting */
const PRIOR_MIN_RATIO = 0.5;   /* ratio units (water per coffee): the dial-in ratio step */
const PRIOR_MIN_TEMP = 2;      /* °F */
/* where one coffee's trail ended, if it ended anywhere: the locked try, else the best try of a trail with at least two tries. Needs a score. */
function priorLanding(t){
  if (!t || !t.count) return null;
  const a = t.locked || (t.count >= 2 ? t.best : null);
  return a && a.total != null ? a : null;
}
/* how far one try sits from the recipe NeuroBrew builds for that coffee on that method: { grind (steps), ratio, tempF } with null where it cannot be said */
function priorOffsets(coffee, methodKey, a, now){
  const m = METHODS.find(x => x.key === methodKey); if (!m || !a) return null;
  const batch = { water:a.water || m.water, tech:a.tech || 'standard', agit:a.agit };
  const r0 = buildRecipe(coffee, methodKey, batch, { grind:0, ratio:0, agit:'' }, now);
  const rs = trailRestore(coffee, methodKey, a, now);
  return { grind:rs && a.um != null ? rs.adjust.grind : null, ratio:a.ratio != null ? Math.round((a.ratio - r0.ratio) * 10) / 10 : null,
    tempF:(a.tempF != null && r0.temp.kind === 'hot') ? Math.round(a.tempF - r0.temp.recF) : null, exact:!rs || rs.exact, step:Math.round((m.um[1] - m.um[0]) / 5 / 10) * 10 };
}
const priorMedian = xs => { const s = xs.slice().sort((p, q) => p - q), k = s.length >> 1; return s.length % 2 ? s[k] : (s[k - 1] + s[k]) / 2; };
/* The suggestion for the coffee on the page.
   objs are the saved rows; coffee is the coffee on the page; opts.grinder is the grinder name you are brewing with, when you picked one: only tries made with it are used, because the same setting is a different grind on a different grinder.
   Returns null when this coffee already has a trail on the method (its own history is better than anyone else's) or when no pattern holds. */
function dialPriors(objs, coffee, methodKey, now, opts){
  opts = opts || {};
  const m = METHODS.find(x => x.key === methodKey); if (!m || !coffee) return null;
  if (historyForCoffee(objs, coffee).some(o => trailMethod(o) === methodKey)) return null;
  const mine = trailKey({ coffee_name:coffee.name, roaster:coffee.roaster, coffee_id:coffee.id });
  const groups = {}, order = [];
  (objs || []).forEach(o => {
    if (trailMethod(o) !== methodKey) return;
    const k = trailKey(o); if (!k || k === mine) return;
    if (!groups[k]){ groups[k] = []; order.push(k); }
    groups[k].push(o);
  });
  const gname = opts.grinder ? norm(opts.grinder).trim() : '';
  let found = [];
  order.forEach(k => {
    const rows = groups[k], c = trailCoffee(rows.slice().sort((x, y) => (y.saved_at || '').localeCompare(x.saved_at || ''))[0]);
    const land = priorLanding(dialTrail(rows, c, methodKey, now)); if (!land) return;
    if (gname && norm(land.grinder).trim() !== gname) return;
    const off = priorOffsets(c, methodKey, land, now); if (!off) return;
    found.push({ key:k, name:c.name || 'Untitled coffee', roast:c.roast, off, locked:!!land.locked });
  });
  /* the same roast level when at least three coffees share it, else every coffee on the method */
  const myRoast = coffee.roast || '', sameRoast = myRoast ? found.filter(f => f.roast === myRoast) : [];
  const scope = sameRoast.length >= PRIOR_MIN_COFFEES ? 'roast' : 'all', used = scope === 'roast' ? sameRoast : found;
  if (used.length < PRIOR_MIN_COFFEES) return null;
  const levers = [];
  [{ key:'grind', min:PRIOR_MIN_GRIND, round:v => Math.round(v * 2) / 2 }, { key:'ratio', min:PRIOR_MIN_RATIO, round:v => Math.round(v * 2) / 2 }, { key:'tempF', min:PRIOR_MIN_TEMP, round:v => Math.round(v) }].forEach(L => {
    const have = used.filter(f => f.off[L.key] != null), vals = have.map(f => f.off[L.key]);
    if (have.length < PRIOR_MIN_COFFEES) return;
    const up = vals.filter(v => v > 0).length, down = vals.filter(v => v < 0).length;
    if (up && down) return;                                  /* any coffee that went the other way ends the pattern */
    if (up + down < PRIOR_MIN_COFFEES) return;
    const val = L.round(priorMedian(vals)); if (Math.abs(val) < L.min) return;
    levers.push({ lever:L.key, value:val, n:up + down, of:have.length, dir:L.key === 'grind' ? (val > 0 ? 'finer' : 'coarser') : L.key === 'ratio' ? (val < 0 ? 'stronger' : 'weaker') : (val > 0 ? 'hotter' : 'cooler') });
  });
  if (!levers.length) return null;
  const st = used[0].off.step || 0;
  levers.forEach(l => {
    const a = Math.abs(l.value);
    l.text = l.lever === 'grind' ? 'Grind ' + l.dir + ' by about ' + (a * st) + ' µm (' + a + (a === 1 ? ' step' : ' steps') + ')'
      : l.lever === 'ratio' ? 'Ratio ' + l.dir + ' by ' + a + ' (' + (l.value < 0 ? 'less water for the same coffee' : 'more water for the same coffee') + ')'
      : 'Water ' + a + '°F ' + l.dir;
  });
  return { methodKey, label:m.label, scope, roast:scope === 'roast' ? myRoast : '', coffees:used.map(f => f.name), n:used.length, levers, step:st,
    caution:'This is a pattern in your own cups. It could come from your taste, your grinder or your water, and it is only a place to start. Taste the first cup and use Dial it in from there.' };
}
/* ---------- backup code: your history as one block of plain text that survives Notes, email, and chat ---------- */
const BK_BEGIN = '-----BEGIN NEUROBREW BACKUP-----', BK_END = '-----END NEUROBREW BACKUP-----';
const BK_CRC = (() => { const t = []; for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function bkCrc32(bytes){ let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = BK_CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return ((c ^ 0xFFFFFFFF) >>> 0).toString(16); }
function bkB64Encode(bytes){ let s = ''; const CH = 0x8000; for (let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

async function bkPipe(bytes, stream){
  const w = stream.writable.getWriter();

}
async function makeBackupCode(csv, opts){

  const all = ['NB1', mode, raw.length, bkCrc32(raw)].join('.') + '.' + bkB64Encode(body) + '.';   /* header, then the data, then a "." that marks the true end */
  return { code:[BK_BEGIN].concat(all.match(/.{1,64}/g), [BK_END]).join('\n'), bytes:raw.length, packed:body.length, mode };
}
const BK_MAX_TEXT = 20000000, BK_MAX_BYTES = 40000000;   /* far above any history that fits in browser storage */
async function bkPipeLimit(bytes, stream, limit){
  const w = stream.writable.getWriter();
  w.write(bytes).catch(() => {}); w.close().catch(() => {});

}
async function readBackupCode(text){

  const t = String(text || '').replace(/\r/g, ''), D = '[-\\u2010-\\u2015\\u2212]*';
  if (!/BEGIN NEUROBREW BACKUP/i.test(t)) return { error:'That does not look like a NeuroBrew backup. It should start with BEGIN NEUROBREW BACKUP.' };
  const mm = new RegExp('BEGIN NEUROBREW BACKUP' + D + '([\\s\\S]*?)\\.[\\s\\u00A0]*' + D + 'END NEUROBREW BACKUP', 'i').exec(t);
  if (!mm) return { error:'The backup looks cut off. Make sure you copied everything, all the way through END NEUROBREW BACKUP.' };
  const inner = mm[1].replace(/[\u2010-\u2015\u2212]/g, '-').replace(/[\s\u00A0\u200B-\u200D\uFEFF]+/g, '').replace(/^-+/, '');   /* a header never starts with "-", so leftover marker dashes can be dropped */   /* some apps turn "-" into a long dash, or add spaces and line breaks */
  const m = /^NB1\.([zr])\.(\d+)\.([0-9a-f]+)\.([A-Za-z0-9_-]*)$/.exec(inner);

  }
  if (bytes.length !== len) return { error:'The backup is the wrong length (' + bytes.length + ' of ' + len + ' bytes), so part of it is missing. Copy it again from the original.' };
  if (bkCrc32(bytes) !== crc) return { error:'The backup does not pass its check, so something was changed. Copy it again from the original.' };
  return { csv:new TextDecoder('utf-8').decode(bytes) };
}
function csvToSheetText(csv){

/* The browser's file picker (showOpenFilePicker and showSaveFilePicker) exists in Chrome and Edge 86 and later, not in Firefox or Safari, and only on a secure page that the person taps.

   that is requested from the tap that needs it. Nothing is written until the person confirms the save, and a file changed on disk since it was read is never written over. */
const PICK_DB = 'brew-and-cup-files', PICK_STORE = 'handles', PICK_KEY = 'history-file';

const PICK_TYPES = [{ description:'Cupping file (CSV)', accept:{ 'text/csv':['.csv'] } }];
const canPickFiles = () => !inClaude() && typeof window.showSaveFilePicker === 'function' && typeof window.showOpenFilePicker === 'function' && window.isSecureContext !== false;
function fhRun(mode, fn){

    let rq; try { rq = indexedDB.open(PICK_DB, 1); } catch(e){ rej(e); return; }
    rq.onupgradeneeded = () => rq.result.createObjectStore(PICK_STORE);
    rq.onerror = () => rej(rq.error);
    rq.onsuccess = () => {
      const db = rq.result;
      try {
        const tx = db.transaction(PICK_STORE, mode), r = fn(tx.objectStore(PICK_STORE));
        tx.oncomplete = () => { db.close(); res(r ? r.result : undefined); };
        tx.onerror = tx.onabort = () => { db.close(); rej(tx.error); };
      } catch(e){ db.close(); rej(e); }
